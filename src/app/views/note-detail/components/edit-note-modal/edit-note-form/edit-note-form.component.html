<div class="p-4 md:p-6 bg-white">
  <form [formGroup]="form" class="flex flex-col gap-4 md:gap-6">
    <!-- Title Field -->
    <div class="flex flex-col gap-2">
      <label for="title" class="block text-sm font-semibold text-gray-700">
        Title
        <span class="text-gray-400 font-normal">(Optional)</span>
      </label>
      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Edit the note title..."
        [ngClass]="getTitleInputClasses()" />
      @if (isTitleInvalid()) {
        <p class="text-xs text-red-600 mt-1">
          {{ getTitleErrorMessage() }}
        </p>
      }
    </div>

    <!-- Content Field -->
    <div class="flex flex-col gap-2">
      <div class="flex justify-between items-center gap-4">
        <label for="content" class="block text-sm font-semibold text-gray-700">
          Note Content
          <span class="text-red-500">*</span>
        </label>
        <span
          class="text-sm font-medium transition-colors duration-200"
          [ngClass]="getCharacterCounterColor()">
          {{ characterCount() }} / 1000
        </span>
      </div>

      <textarea
        id="content"
        formControlName="content"
        placeholder="Edit your note content here..."
        rows="6"
        [ngClass]="getContentTextareaClasses()"
        (blur)="markContentAsTouched()"></textarea>

      @if (isContentInvalid()) {
        <p class="text-xs text-red-600 mt-1">
          {{ getContentErrorMessage() }}
        </p>
      }
    </div>

    <!-- Buttons -->
    <div class="flex gap-3 justify-end mt-2 pt-4 border-t border-gray-200">
      <button
        type="button"
        (click)="onCancel()"
        [disabled]="isSubmitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg transition-all duration-200 hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus-visible:ring-2 focus-visible:ring-gray-400 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-300">
        Cancel
      </button>

      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="form.invalid || isSubmitting()"
        class="px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 border border-indigo-600 rounded-lg transition-all duration-200 hover:from-indigo-700 hover:to-purple-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:from-indigo-600 disabled:hover:to-purple-600 disabled:hover:shadow-none inline-flex items-center gap-2">
        @if (isSubmitting()) {
          <nz-spin nzSimple [nzSize]="'small'"></nz-spin>
        }
        {{ isSubmitting() ? 'Saving...' : 'Save Changes' }}
      </button>
    </div>
  </form>
</div>
