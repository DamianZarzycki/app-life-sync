<div class="bg-white rounded-lg">
  <!-- Warning Icon and Title -->
  <div class="flex flex-col items-center gap-4 mb-6">
        <nz-icon
        nzIcon="delete"
        nzTheme="fill"
        class="text-red-600 transition-colors duration-200 text-lg"></nz-icon> 
    <h2 class="text-xl md:text-2xl font-bold text-gray-900">Delete Note</h2>
    <span class="text-gray-500">Are you sure you want to delete this note? This action cannot be undone.</span>
    
    <div class="flex gap-2 justify-end mt-6 w-full">
        <button
          type="button"
          (click)="onCancel()"
          class="px-6 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg transition-all duration-200 hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus-visible:ring-2 focus-visible:ring-gray-400 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-300">
          Cancel
        </button>
    
        <button
          type="button"
          (click)="onSubmit()"
          class="px-6 py-2 text-sm font-semibold text-white bg-red-600 border border-red-600 rounded-lg transition-all duration-200 hover:bg-red-700 hover:border-red-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-red-500 focus-visible:ring-2 focus-visible:ring-red-500 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-red-600 disabled:hover:border-red-600 disabled:hover:shadow-none inline-flex items-center gap-2">
          Delete Note
        </button>
    </div>
  </div>
</div>
