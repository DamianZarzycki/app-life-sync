<!-- Report Feedback Modal Overlay -->
<div class="feedback-overlay fixed inset-0 bg-black/50 flex items-center justify-center z-1000 p-4 md:p-0">
  <div class="feedback-modal bg-white rounded-lg shadow-lg max-w-md w-full md:max-w-md overflow-hidden">
    <!-- Modal Header -->
    <div class="feedback-header bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6 border-b border-white/10">
      <h3 class="feedback-title text-lg font-semibold mb-2 text-white m-0">
        How helpful was this report?
      </h3>
      <p class="feedback-subtitle text-sm text-white/95 m-0">
        Your feedback helps us improve report quality
      </p>
    </div>

    <!-- Modal Body -->
    <div class="feedback-body p-6 max-h-96 overflow-y-auto space-y-6">
      <!-- Error Alert -->
      @if (error()) {
        <div class="p-3 bg-red-50 border border-red-200 rounded text-sm text-red-700">
          {{ error() }}
        </div>
      }

      <!-- Emoji Rating Selection -->
      <div>
        <p class="text-sm font-medium mb-3 text-gray-700">
          Select a rating:
        </p>
        <div class="flex gap-4 justify-center flex-wrap">
          @for (option of ratingOptions; track option.value) {
            <button
              type="button"
              class="rating-button flex flex-col items-center gap-2 px-4 py-3 border-2 border-gray-200 rounded-lg bg-white transition-all duration-200 text-sm font-medium hover:border-indigo-600 hover:bg-gray-50 disabled:opacity-60 disabled:cursor-not-allowed focus:outline-none focus-visible:outline-2 focus-visible:outline-indigo-500 focus-visible:outline-offset-2"
              [class.selected]="selectedRating() === option.value"
              [class.border-indigo-600]="selectedRating() === option.value"
              [class.bg-indigo-50]="selectedRating() === option.value"
              [class.text-indigo-700]="selectedRating() === option.value"
              (click)="selectRating(option.value)"
              [attr.aria-label]="'Rate: ' + option.label"
              [disabled]="isSubmitting()"
            >
              <span class="rating-emoji text-2xl md:text-3xl leading-none">{{ option.emoji }}</span>
              <span class="rating-label text-center">{{ option.label }}</span>
            </button>
          }
        </div>
      </div>

      <!-- Comment Textarea -->
      <div>
        <label for="feedback-comment" class="block text-sm font-semibold mb-2 text-gray-700">
          Additional feedback
          <span class="font-normal text-gray-400">(Optional)</span>
        </label>
        <textarea
          id="feedback-comment"
          class="feedback-textarea w-full px-3 py-2 border border-gray-300 rounded-lg text-sm font-normal resize-none focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 disabled:bg-gray-50 disabled:opacity-60 disabled:cursor-not-allowed transition-all duration-200"
          [value]="comment()"
          #textarea
          (input)="updateComment(textarea.value)"
          [disabled]="isSubmitting()"
          placeholder="Share any additional thoughts or suggestions..."
          rows="4"
          maxlength="300"
        ></textarea>
        <div class="flex justify-between items-center mt-2">
          <p class="text-xs text-gray-500">
            Maximum 300 characters
          </p>
          <p
            class="text-xs font-medium transition-colors duration-200"
            [class.text-red-600]="isCharCountWarning()"
            [class.text-gray-500]="!isCharCountWarning()"
          >
            {{ remainingChars() }} characters remaining
          </p>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="feedback-footer border-t border-gray-200 p-4 flex gap-3 justify-end bg-white">
      <button
        type="button"
        nz-button
        nzType="default"
        (click)="cancel()"
        [disabled]="isSubmitting()"
        class="px-4 py-2 text-sm font-semibold text-gray-700 bg-white border border-gray-300 rounded-lg transition-all duration-200 hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-400 focus-visible:ring-2 focus-visible:ring-gray-400 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:bg-white disabled:hover:border-gray-300"
      >
        Skip
      </button>
      <button
        type="button"
        nz-button
        nzType="primary"
        (click)="submit()"
        [disabled]="!isRatingSelected() || isSubmitting()"
        [nzLoading]="isSubmitting()"
        class="px-4 py-2 text-sm font-semibold text-white bg-gradient-to-r from-indigo-600 to-purple-600 border border-indigo-600 rounded-lg transition-all duration-200 hover:from-indigo-700 hover:to-purple-700 hover:shadow-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus-visible:ring-2 focus-visible:ring-indigo-500 disabled:opacity-60 disabled:cursor-not-allowed disabled:hover:from-indigo-600 disabled:hover:to-purple-600 disabled:hover:shadow-none"
      >
        {{ isSubmitting() ? 'Submitting...' : 'Submit Feedback' }}
      </button>
    </div>
  </div>
</div>
