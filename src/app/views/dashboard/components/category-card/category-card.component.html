<div
  [ngClass]="getCardClasses()"
  (click)="onViewNotesClick()"
  role="button"
  [attr.aria-label]="'View notes for ' + category()?.name"
  tabindex="0"
  class="cursor-pointer">
  <!-- Card Header -->
  <div class="category-card__header">
    <h3 class="category-card__title">{{ category()?.name | uppercase }}</h3>
  </div>

  <!-- Card Body -->
  <div class="category-card__body">
    <!-- Progress Bar Section -->
    <div class="category-card__progress-section">
      <nz-progress
        [nzPercent]="progressPercentage()"
        [nzStrokeColor]="'#3b82f6'"
        [nzShowInfo]="false">
      </nz-progress>
    </div>

    <!-- Note Count Display -->
    <div class="category-card__note-count">
      <span class="category-card__current-count">{{ noteCount() }}</span>
      <span class="category-card__separator"> / </span>
      <span class="category-card__max-count">{{ maxNotes() }}</span>
      <span class="category-card__label"> notes</span>
    </div>
  </div>

  <!-- Card Footer -->
  <div class="category-card__footer">
    <button
      [disabled]="isLoading()"
      (click)="onAddNoteClick(); $event.stopPropagation()"
      [title]="categoryLabel()"
      [attr.aria-label]="categoryLabel()"
      class="category-card__add-note-btn">
      @if (!isLoading()) {
        <i nz-icon nzType="plus" nzTheme="outline"></i>
        <span class="category-card__add-note-btn-text" [title]="categoryLabel()"
          >Add Note</span
        >
      } @else {
        <nz-spin nzSimple [nzSize]="'small'"></nz-spin>
      }
    </button>
  </div>
</div>
