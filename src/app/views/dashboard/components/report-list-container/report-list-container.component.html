<div class="report-list-container-wrapper grid grid-cols-1 gap-6">
  <!-- Error Alert Banner -->
  @if (viewState().error; as error) {
    <div
      class="error-banner bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded">
      <div
        class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div class="flex gap-3 flex-1">
          <span class="text-2xl flex-shrink-0">⚠️</span>
          <div class="flex-1">
            <h3 class="text-red-800 font-semibold mb-1">
              {{ error.error.message }}
            </h3>
            @if (error.error.details) {
              <p
                class="text-red-700 text-sm bg-red-50 p-2 rounded font-mono overflow-x-auto">
                {{ error.error.details | json }}
              </p>
            }
          </div>
        </div>
        <div class="flex gap-2 flex-shrink-0 w-full md:w-auto">
          <button
            (click)="retryLastAction()"
            class="flex-1 md:flex-initial px-4 py-2 bg-red-600 hover:bg-red-700 text-white rounded font-medium transition-colors">
            Retry
          </button>
          <button
            (click)="dismissError()"
            class="flex-1 md:flex-initial px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-900 rounded font-medium transition-colors">
            Dismiss
          </button>
        </div>
      </div>
    </div>
  }

  <!-- Report List with Table -->

  <!-- Pagination Info -->
  @if (true) {
    <div class="col-span-1">
      <app-report-list
        [reports]="displayReports()"
        [isLoading]="isInitialLoading()"
        [isLoadingMore]="viewState().isLoadingMore"
        [hasMore]="viewState().hasMore"
        [currentIndex]="viewState().currentOffset + displayReports().length"
        (loadMore)="onLoadMore()"
        (reportClick)="onReportClick($event)">
      </app-report-list>
    </div>
  }
</div>
