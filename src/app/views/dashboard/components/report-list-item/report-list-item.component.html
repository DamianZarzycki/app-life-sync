<!-- 
  ReportListItem Template
  This component is primarily used with ng-zorro table for cell rendering.
  When used standalone, it provides the basic structure and styling.
-->
<div class="report-item-wrapper" (click)="onItemClick()">
  <!-- Index -->
  <div class="cell cell-index text-sm font-mono text-gray-500">
    {{ index() }}
  </div>

  <!-- Generated By Badge -->
  <div class="cell cell-generated-by">
    <nz-tag
      [nzColor]="getGeneratedByLabel() === 'Scheduled' ? 'blue' : 'orange'">
      {{ getGeneratedByLabel() }}
    </nz-tag>
  </div>

  <!-- Created At Date -->
  <div class="cell cell-created-at text-sm text-gray-600">
    {{ getFormattedDate() }}
  </div>

  <!-- Delivery Channel -->
  <div class="cell cell-channel text-sm">
    <span class="mr-1">
      {{ getDeliveryChannelIcon() === 'mail' ? '✉️' : '🔔' }}
    </span>
    {{ getDeliveryChannelLabel() }}
  </div>

  <!-- Delivery Status -->
  <div class="cell cell-status">
    <nz-tag [nzColor]="getDeliveryStatusColor()">
      {{ getDeliveryStatusLabel() }}
    </nz-tag>
  </div>
</div>
